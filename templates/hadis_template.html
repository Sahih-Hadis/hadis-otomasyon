<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<style>
  @font-face {
    font-family: 'Amiri';
    src: url('https://fonts.gstatic.com/s/amiri/v27/J7aRnpd8CGxBHqUpvrIw74NL.woff2') format('woff2');
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1350px;
    background-color: #0F3D2E;
    font-family: 'Georgia', serif;
    position: relative;
    overflow: hidden;
  }
  /* Çerçevenin içini kaplayan tek motif katmanı */
  .single-motif {
    position: absolute;
    top: 56px;
    left: 56px;
    right: 56px;
    bottom: 56px;
    background-image: url('https://png.pngtree.com/png-clipart/20230411/original/pngtree-seamless-golden-islamic-pattern-transparent-arabic-geometric-patterns-png-image_9043106.png');
    background-repeat: no-repeat;
    background-position: center;
    background-size: cover; /* Resmi sündürmeden çerçeve alanına tam sığdırır */
    opacity: 0.35; /* Belirginliği artırmak/azaltmak için değiştirebilirsin */
    mix-blend-mode: multiply; /* Yeşil arka planla şık bir şekilde bütünleşmesini sağlar */
    pointer-events: none;
    z-index: 1;
  }
  .outer-border {
    position: absolute;
    top: 40px; left: 40px; right: 40px; bottom: 40px;
    border: 4px solid #C9A227;
    z-index: 2;
  }
  .inner-border {
    position: absolute;
    top: 56px; left: 56px; right: 56px; bottom: 56px;
    border: 1px solid #C9A227;
    z-index: 2;
  }
  .content-panel {
    position: absolute;
    top: 380px; left: 140px; right: 140px;
    background: #F5EFE0;
    padding: 70px 60px;
    text-align: center;
    z-index: 3;
  }
  .arabic {
    font-family: 'Amiri', serif;
    font-size: 46px;
    line-height: 1.9;
    color: #1a1a1a;
    direction: rtl;
    margin-bottom: 40px;
  }
  .divider {
    width: 200px;
    height: 1px;
    background: #C9A227;
    margin: 0 auto 40px;
  }
  .meal {
    font-size: 34px;
    line-height: 1.6;
    color: #1a1a1a;
    font-style: italic;
  }
  .ravi {
    font-size: 22px;
    color: #5a5a3a;
    margin-top: 30px;
  }
  .kaynak {
    font-size: 22px;
    color: #5a5a3a;
    margin-top: 8px;
  }
  .footer {
    position: absolute;
    bottom: 90px; left: 0; right: 0;
    text-align: center;
    z-index: 3;
  }
  .username {
    font-family: 'Georgia', serif;
    font-size: 30px;
    color: #C9A227;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
  <!-- İç çerçevenin içinde kalan tek motif katmanı -->
  <div class="single-motif"></div>

  <div class="outer-border"></div>
  <div class="inner-border"></div>

  <div class="content-panel">
    <div class="arabic">{{ARAPCA}}</div>
    <div class="divider"></div>
    <div class="meal">"{{MEAL}}"</div>
    <div class="ravi">{{RAVI}}</div>
    <div class="kaynak">{{KAYNAK}}</div>
  </div>

  <div class="footer">
    <div class="username">@sahihhadisvesunnet</div>
  </div>
</body>
</html>
