name: Günlük Hadis Paylaşımı

on:
  schedule:
    # Her gün Türkiye saatiyle 09:00 (UTC 06:00)
    - cron: "0 6 * * *"
  workflow_dispatch: {}   # manuel tetiklemek için

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Görseli üret
        run: python generate_image.py

      - name: Üretilen görseli ve durumu commitle
        run: |
          git config user.name "hadis-bot"
          git config user.email "hadis-bot@users.noreply.github.com"
          git add docs/latest.png docs/latest_caption.txt state.json
          git commit -m "Günlük hadis görseli güncellendi" || echo "Değişiklik yok"
          git push

      - name: GitHub Pages'in güncellenmesini bekle
        run: sleep 60

      - name: Instagram'a paylaş
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          GITHUB_PAGES_URL: ${{ vars.GITHUB_PAGES_URL }}
        run: python post_instagram.py
